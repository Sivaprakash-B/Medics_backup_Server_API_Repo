server {
    listen 80;
    server_name api.sef.local;          # ← replace with your actual hostname
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sef.local;

    # ── Sectigo wildcard cert (same pattern as your other apps) ──
    ssl_certificate     /etc/ssl/certs/sef-wildcard.crt;
    ssl_certificate_key /etc/ssl/private/sef-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Rate limiting at Nginx level (optional, belt-and-suspenders) ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    location / {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Disable Swagger in production (uncomment if desired) ──
    # location /docs { return 404; }
    # location /redoc { return 404; }

    access_log /var/log/nginx/sef-api-access.log;
    error_log  /var/log/nginx/sef-api-error.log;
}
